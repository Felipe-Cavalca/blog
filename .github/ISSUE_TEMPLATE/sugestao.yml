name: Sugerir um tema
description: Conte o que você gostaria de ver no blog, sem criar arquivos.
title: "[Sugestão] "
body:
  - type: markdown
    attributes:
      value: "A aprovação final é sempre do Felipe, conforme o que ele considerar relevante para o blog. Enviar uma sugestão não garante publicação ou prazo."
  - type: input
    id: credito
    attributes:
      label: Seu nome para os créditos
      description: Como você gostaria de ser identificado se a ideia virar um post?
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: Usuário no GitHub (opcional)
      description: Sem @ ou URL. Preencha se quiser um link para seu perfil nos créditos.
  - type: textarea
    id: tema
    attributes:
      label: Qual tema você sugere?
      description: Conte o assunto e as perguntas que gostaria de ver respondidas.
    validations:
      required: true
  - type: textarea
    id: motivacao
    attributes:
      label: Por que acha interessante?
      description: Explique sua motivação e inclua referências, se houver.
    validations:
      required: true
  - type: checkboxes
    id: aprovacao
    attributes:
      label: Critério de publicação
      options:
        - label: Entendo que a aprovação cabe somente ao Felipe, conforme o que ele considerar relevante, e que a sugestão não garante publicação.
          required: true
