<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/colors.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}"><span class="site-mark" aria-hidden="true">F</span>{{ site.title | escape }}</a>
      <p class="header-note">{{ site.description | escape }}</p>
    </header>
    <main id="conteudo">{{ content }}</main>
    <footer class="site-footer"><p>{% if page.layout == 'post' %}{% include author.html post=page %}{% else %}Escrito por Felipe, revisado por Codex.{% endif %}</p><p><a href="{{ site.repository_url }}/issues/new?template=sugestao.yml">Sugerir um tema</a> · <a href="{{ site.repository_url }}/issues/new?template=post.yml">Enviar um post</a> · <a href="{{ site.repository_url }}/compare">Abrir PR</a></p></footer>
  </body>
</html>
